(()=>{const board=document.getElementById('board'),status=document.getElementById('status');let order=[0,1,2,3,4,5,6,7,8],selected=null,moves=0,playing=false;
function render(){board.innerHTML='';order.forEach((piece,pos)=>{const tile=document.createElement('button');tile.type='button';tile.className='tile';tile.style.backgroundPosition=`${(piece%3)*50}% ${Math.floor(piece/3)*50}%`;tile.dataset.label=playing?'':String(piece+1);tile.setAttribute('aria-label',`টুকরো ${piece+1}, বোর্ডের স্থান ${pos+1}`);if(selected===pos)tile.classList.add('selected');tile.addEventListener('click',()=>choose(pos));board.appendChild(tile)})}
function shuffle(){order=[0,1,2,3,4,5,6,7,8];for(let i=0;i<70;i++){const a=Math.floor(Math.random()*9),b=Math.floor(Math.random()*9);[order[a],order[b]]=[order[b],order[a]]}if(order.every((v,i)=>v===i))[order[0],order[1]]=[order[1],order[0]];selected=null;moves=0;playing=true;status.textContent='চাল: ০ — টুকরো বেছে নিয়ে অন্য টুকরোয় চাপ দিন।';render()}
function choose(pos){if(!playing){status.textContent='প্রথমে “খেলা শুরু করুন” বোতামে চাপ দিন।';return}if(selected===null){selected=pos;render();return}if(selected===pos){selected=null;render();return}[order[selected],order[pos]]=[order[pos],order[selected]];selected=null;moves++;if(order.every((v,i)=>v===i)){playing=false;render();status.textContent=`🎉 অভিনন্দন! পাজল সম্পূর্ণ হয়েছে। মোট চাল: ${moves}`}else{status.textContent=`চাল: ${moves} — খুব ভালো! চালিয়ে যান।`;render()}}
document.getElementById('start').addEventListener('click',shuffle);document.getElementById('reset').addEventListener('click',shuffle);render()})();
</script></body></html>
